[package]
name = "connection_barrage"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"
name = "connection_barrage"

[[bin]]
path = "src/main.rs"
name = "connection_barrage"   
   

[dependencies]
reqwest = { version = "0.12.15", features = ["blocking"] }
mdns_scanner = { path = "../mdns_scanner" }
tokio = { version = "1.44.2", features = ["full"] }
tokio-tungstenite = "0.26.2"
futures = "0.3.31"
config = "0.15.11"
rayon = "1.10.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
   
